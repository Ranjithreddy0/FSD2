<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            display: flex;
            justify-content: space-around;

        }
        .d1{
            height: 100px;
            width: 100px;
            background-color: black;
            order: 2;
        }
        .d2{
            height: 100px;
            width: 100px;
            background-color: rgb(83, 45, 178);
            order: 0;
        }
        .d3{
            height: 100px;
            width: 100px;
            background-color: rgb(198, 12, 127);
            order: 1;
        }
        .d4{
            height: 100px;
            width: 100px;
            background-color: rgb(188, 180, 19);
            order: 3;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="d1"></div>
        <div class="d2"></div>
        <div class="d3"></div>
        <div class="d4"></div>
      
    </div>
</body>
</html>
