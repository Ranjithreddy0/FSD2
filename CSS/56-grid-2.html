<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .continer{
            display: grid;
            height: 900px;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(2,1fr);
         }
         .box1{
            /* height: 100px;
            width: 100px; */
            background-color: black;
            /* grid-column-start: 1;
            grid-column-end: 3; */
        }
        .box2{
            /* height: 100px;
            width: 100px; */
            background-color: rgb(242, 17, 17);
        }
        .box3{
            /* height: 100px;
            width: 100px; */
            background-color: rgb(173, 207, 19);
        }
        .box4{
            /* height: 100px;
            width: 100px; */
            background-color: rgb(15, 75, 185);
        }
        .box5{
            /* height: 100px;
            width: 100px; */
            background-color: rgb(11, 176, 235);
        }
        .box6{
            /* height: 100px;
            width: 100px; */
            background-color: rgb(82, 9, 240);
            grid-row-start: 1;
            grid-row-end: 3;
        }
    </style>


</head>

<body>
    <div class="continer">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>
        <div class="box5"></div>
        <div class="box6"></div>
    </div>
</body>

</html>
