<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .d1 {
            height: 700px;
            width: 1500px;
            border: 5px solid black;
            box-sizing: border-box;
        }

        .d2 {
            height: 500px;
            width: 1300px;
            border: 5px solid black;
            margin: 100px 100px;
        }
        .d3{
            height: 300px;
            width: 1100px;
            border: 5px solid black;
            margin: 100px;
        }
        .d4{
            height:100px ;
            width: 900px;
            margin: 100px;
            border: 5px solid black;
        }
    </style>
</head>

<body>
    <div class="d1">
        <div class="d2">
            <div class="d3">
                <div class="d4">
                </div>
            </div>
        </div>
    </div>
</body>

</html>
