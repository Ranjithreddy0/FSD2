<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
        }
        .main{
            display: flex;
            justify-content: space-around;
        }
        .d1{
            height: 100px;
            width: 100px;
            background-color: black;
            flex-grow: 1;
        }
        .d2{
            height: 100px;
            width: 100px;
            background-color: rgb(83, 45, 178);
            flex-grow: 2;
        }
        .d3{
            height: 100px;
            width: 100px;
            background-color: rgb(198, 12, 127);
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="d1"></div>
        <div class="d2"></div>
        <div class="d3"></div>
    </div>
</body>
</html>
