<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            padding: 15px 16px;
            border: none;
            background-color: mediumpurple;
            color: black;
            border-radius: 10px;
            transition:background-color 4s;
            cursor: pointer;
        }
        button:hover{
            background-color: blue;
            color: white;
        }
        input:focus{
            background-color: black;
            color: white;
        }
        a{
            display: block;
            text-decoration: none;
            padding-top: 20px;
            transition: color 0.3s;
        }
        a:hover{
            color: brown;
        }
        a:active{
            color: green;
        }
        a:visited{
            color: purple;
        }
        li{
            list-style-type: none;
        }
        li:first-child{
            color: brown;
        }
        li:last-child{
            color: blue;
        }
        li:nth-child(odd){
            color: purple;
        }
    </style>
</head>
<body>
    <button>click me</button>
    <input type="text" placeholder="type here">
    <a href="https://www.youtube.com/">Click Me Here</a>
    <a href="https://github.com/harshit-8080?tab=repositories">Click Me Here</a>

    <ul>
        <li>home</li>
        <li>about</li>
        <li>index</li>
        <li>hlo</li>
        <li>hi</li>
    </ul>

</body>
</html>
