<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 100px;
            width: 100px;
            background-color: blue;
            animation-name: letsmakebig;
            animation-duration:4s;
            animation-iteration-count: infinite;
            animation-delay: 2s;
        }
        @keyframes letsmakebig{
                    from{
                        height: 100px;
                        width: 100px;
                        background-color: rgb(255, 217, 0);
                    }
                    to{
                        height: 400px;
                        width: 400px;
                        background-color: red;
                        border-radius: 50%;
                        border: 2px solid black;
                    }
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
