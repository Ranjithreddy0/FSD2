<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* selecting elements using id */
        #d1{
            height: 100px;
            width: 100px;
            background-color: blue;
        }
        #d2{
            height: 100px;
            width: 100px;
            background-color:brown;
        }
        #d3{
            height: 100px;
            width: 100px;
            background-color:beige;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div id="d1"></div>
    <div id="d2"></div>
    <div id="d3"></div>
</body>
</html>
