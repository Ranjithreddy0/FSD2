    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        .gallery img{
            width: 300px;
            height: 300px;
            margin: 20px;
            box-shadow: 2px 3px 10px rgb(169, 89, 50);
        }
        .gallery{
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
        }
        @media (0px<=width<=200px){
            .gallery img{
                height: 50px;
                width: 50px;
            }
        }
        @media (201px<=width<=400px){
            .gallery img{
                height: 100px;
                width: 100px;
            }
        }
        @media (401px<=width<=600px){
            .gallery img{
                height: 150px;
                width: 150px;
            }
        }
        @media (601px<=width<=800px){
            .gallery img{
                height: 200px;
                width: 200px;
            }
        }
        @media (801px<=width<=1000px){
            .gallery img{
                height: 250px;
                width: 250px;
            }
        }
    </style>
