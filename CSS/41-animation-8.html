<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            width: 300px;
            height: 200px;
            background-color: transparent;
            animation-name: dog;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            position: relative;
        }
        @keyframes dog{
            0%{
                left: 0px;
            }
            25%{
                left: 100px;
            }
            50%{
                left: 200px;
            }
            75%{
                left: 300px;
            }
            100%{
                left: 400px;
            }
        }
    </style>
</head>
<body>
    <img src="https://media3.giphy.com/media/Y0g7w7UZwrmpQ9GW3m/giphy.gif?cid=6c09b95203c433b1c76896c918a995f28db45d71135ff7bd&ep=v1_internal_gifs_gifId&rid=giphy.gif&ct=g" alt="">

   
</body>
</html>
