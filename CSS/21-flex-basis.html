<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
        }
        .continer{
            display: flex;
            justify-content: space-around;

        }
        .d1{
            height: 100vh;
            width: 100px;
            background-color: blue;
            flex-basis: 20%;
        }
        .d2{
            height: 100vh;
            width: 100px;
            background-color: blueviolet;
            flex-basis: 50%;
        }
        .d3{
            height: 100vh;
            width: 100px;
            background-color: brown;
            flex-basis: 20%;
        }
    </style>
</head>
<body>
    <div class="continer">
        <div class="d1"></div>
        <div class="d2"></div>
        <div class="d3"></div>
    </div>
</body>
</html>
