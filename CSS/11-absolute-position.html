<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .continer{
            height: 700px;
            width: 700px;
            border: 2px solid black;
            margin: 0px auto;
            position: relative;
        }
        .box{
            height: 200px;
            width: 200px;
            border: 2px solid red;
            position: absolute;
            right: 100px;
            top: 100px;
        }
    </style>
</head>
<body>
    <div class="continer">
        <div class="box"></div>
    </div>
</body>
</html>
